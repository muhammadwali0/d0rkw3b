[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "d0rkw3b"
version = "1.0.0"
description = "Privacy-first local OSINT query engine and investigation launcher"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "D0RKW3B contributors"}]
dependencies = []

[project.scripts]
d0rkw3b = "d0rkw3b.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
d0rkw3b = ["providers/*.json"]
