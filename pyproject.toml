[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "d0rkw3b"
version = "1.1.0"
description = "The Local OSINT Workbench: queries, evidence, provenance and explicit collection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "D0RKW3B contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8", "ruff>=0.9"]

[project.scripts]
d0rkw3b = "d0rkw3b.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
d0rkw3b = ["providers/*.json", "recipes/*.json"]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
